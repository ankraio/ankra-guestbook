# Ankra reads three scan artifacts back from this workflow's runs. The names
# are matched exactly, not by prefix, and Ankra's workflow validator refuses a
# workflow that uploads them under any other name:
#
#   ankra-semgrep-scan   Semgrep JSON, the object carrying results[]
#   ankra-checkov-scan   Checkov JSON, one report or a list of framework reports
#   ankra-security-scan  Trivy JSON, the object carrying Results[]
#
# Each artifact must hold exactly ONE JSON document: only the first .json
# member of the newest artifact with that name is read, so merging several
# component reports into one artifact hides all but the first. Keep both rules
# if you fold these scans into a pipeline of your own.
name: Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: registry.ankra.cloud
  IMAGE_NAME: org-7b2fedb6-4d79-45fd-b71a-044a2cfddce7/ankra-guestbook

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config "p/default" --config "p/docker" --config "p/github-actions" --config "p/golang" --json --output semgrep-results.json

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('semgrep-results.json') != ''
        with:
          name: ankra-semgrep-scan
          path: semgrep-results.json
          retention-days: 90

      - name: Check Semgrep findings
        if: always() && hashFiles('semgrep-results.json') != ''
        run: |
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep-results.json)
          warnings=$(jq '[.results[] | select(.extra.severity == "WARNING")] | length' semgrep-results.json)
          {
            echo "### Semgrep"
            echo ""
            echo "| Severity | Findings |"
            echo "| --- | --- |"
            echo "| ERROR | $errors |"
            echo "| WARNING | $warnings |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$errors" -gt 0 ]; then
            jq -r '.results[] | select(.extra.severity == "ERROR") | "::error file=\(.path),line=\(.start.line)::\(.check_id): \(.extra.message)"' semgrep-results.json
            echo "Semgrep found $errors ERROR-severity finding(s). Fix them, or lower the gate in this workflow if you accept the risk."
            exit 1
          fi

      - name: Run Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          output_format: json
          output_file_path: checkov-results.json
          soft_fail: true
          framework: dockerfile,helm,github_actions

      - name: Upload Checkov results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('checkov-results.json') != ''
        with:
          name: ankra-checkov-scan
          path: checkov-results.json
          retention-days: 90

      - name: Check Checkov findings
        if: always() && hashFiles('checkov-results.json') != ''
        run: |
          failed=$(jq '[.. | objects | select(has("results")) | .results.failed_checks // []] | flatten | length' checkov-results.json)
          {
            echo "### Checkov"
            echo ""
            echo "Failed checks: $failed"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -gt 0 ]; then
            echo "Checkov reported $failed failed check(s); see the ankra-checkov-scan artifact."
          fi

      - name: Check Checkov chart coverage
        if: always() && hashFiles('checkov-results.json') != ''
        run: |
          if [ -z "$(find . -name Chart.yaml -not -path '*/charts/*' -print -quit)" ]; then
            exit 0
          fi
          if ! command -v helm >/dev/null 2>&1; then
            {
              echo "### Checkov chart coverage"
              echo ""
              echo "helm is not installed on this runner, so chart rendering was not verified."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          unrendered=""
          while IFS= read -r chart_file; do
            chart_directory=$(dirname "$chart_file")
            helm dependency build "$chart_directory" >/dev/null 2>&1 || true
            if ! render_error=$(helm template "$chart_directory" 2>&1); then
              unrendered="$unrendered $chart_directory"
              echo "::warning file=$chart_file::Checkov could not render this chart, so none of its resources were scanned: $(printf '%s' "$render_error" | tr '\n' ' ' | cut -c 1-300)"
            fi
          done < <(find . -name Chart.yaml -not -path '*/charts/*' | sort)
          {
            echo "### Checkov chart coverage"
            echo ""
            if [ -n "$unrendered" ]; then
              echo "Checkov could not render these charts, so the IaC scan did not cover them:"
              for chart_directory in $unrendered; do
                echo "- $chart_directory"
              done
              echo ""
              echo "A chart that fails to render reports zero findings, which reads as clean. Give every value the chart requires a default in values.yaml so it renders unattended."
            else
              echo "Every Helm chart rendered, so Checkov scanned them."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the image registry
        uses: docker/login-action@v3
        with:
          registry: registry.ankra.cloud
          username: ${{ secrets.ANKRA_REGISTRY_USERNAME }}
          password: ${{ secrets.ANKRA_REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.ankra.cloud/org-7b2fedb6-4d79-45fd-b71a-044a2cfddce7/ankra-guestbook
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.35.0
        env:
          TRIVY_USERNAME: ${{ secrets.ANKRA_REGISTRY_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.ANKRA_REGISTRY_PASSWORD }}
        with:
          image-ref: registry.ankra.cloud/org-7b2fedb6-4d79-45fd-b71a-044a2cfddce7/ankra-guestbook:sha-${{ steps.vars.outputs.short_sha }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-results.json') != ''
        with:
          name: ankra-security-scan
          path: trivy-results.json
          retention-days: 90

      - name: Check Trivy findings
        if: always() && hashFiles('trivy-results.json') != ''
        run: |
          fixable=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH") | select(.FixedVersion != null and .FixedVersion != "")] | length' trivy-results.json)
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)
          {
            echo "### Trivy"
            echo ""
            echo "| Severity | Findings |"
            echo "| --- | --- |"
            echo "| CRITICAL | $critical |"
            echo "| HIGH | $high |"
            echo "| Fixable CRITICAL/HIGH | $fixable |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$fixable" -gt 0 ]; then
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH") | select(.FixedVersion != null and .FixedVersion != "") | "::error::\(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> fixed in \(.FixedVersion)"' trivy-results.json
            echo "Trivy found $fixable fixable CRITICAL/HIGH vulnerability(ies). Update the affected packages, or lower the gate in this workflow if you accept the risk."
            exit 1
          fi
