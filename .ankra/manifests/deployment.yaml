apiVersion: v1
kind: ServiceAccount
metadata:
  name: guestbook-coldwalk
  labels:
    app.kubernetes.io/name: guestbook-coldwalk
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-coldwalk
  labels:
    app.kubernetes.io/name: guestbook-coldwalk
  annotations:
    ankra.io/generated: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: guestbook-coldwalk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guestbook-coldwalk
    spec:
      serviceAccountName: guestbook-coldwalk
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ankra-registry-pull
      containers:
        - name: guestbook-coldwalk
          image: registry.ankra.cloud/org-7b2fedb6-4d79-45fd-b71a-044a2cfddce7/ankra-guestbook:${{ ankra.image_tag }}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: guestbook-coldwalk-db-app
                  key: uri
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: guestbook-coldwalk-db-app
                  key: dbname
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: guestbook-coldwalk-db-app
                  key: host
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: guestbook-coldwalk-db-app
                  key: password
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: guestbook-coldwalk-db-app
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: guestbook-coldwalk-db-app
                  key: username
            - name: PORT
              value: "8080"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 150
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
